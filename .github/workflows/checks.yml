# Checks every pull request: the C++ is formatted (scripts/ci/format.py), the .vcxproj/.filters files list
# every source file (scripts/ci/sync_projects.py), the solution builds and its tests pass as the release build does
# (release.yml), and the Mac build (src/mac) builds and its tests pass. Run either script without --check locally to
# fix what it reports.
name: Checks

on:
  pull_request:
  # Fork only, never upstream: this branch's run of the checks a pull request gets.
  push:
    branches: ['windows-no-audio-hang']

jobs:
  checks:
    # The same image as the release build, so clang-format is Visual Studio's bundled copy, as it is locally.
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Find Visual Studio's clang-format
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $clangFormat = Join-Path $vs "VC\Tools\Llvm\x64\bin\clang-format.exe"
          if (-not (Test-Path $clangFormat)) { throw "clang-format not found at $clangFormat" }
          & $clangFormat --version
          "CLANG_FORMAT=$clangFormat" >> $env:GITHUB_ENV

      - name: Formatting
        run: python scripts/ci/format.py --check

      - name: Project files
        if: success() || failure()
        run: python scripts/ci/sync_projects.py --check

  build:
    # The release build's image and configuration, so a pull request that builds here builds for a release.
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # nbgv counts commits for the version built into the exe, so it needs the full history.
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The shaders' dxc is fetched by the build itself (MCFetchDxc in src/MechCommander.props).
      - name: Build
        run: msbuild src\MCRedux.slnx -p:Configuration=Release -p:Platform=x64 -m

      # The game: tests need the retail install (--game), which the runner doesn't have; they pass with a note.
      - name: Test
        run: src\build\bin\x64\Release\mc_tests.exe

  macos:
    # The Mac build (src/mac): the game and the tests with CMake on Apple Silicon, then the tests, as the build job does
    # on Windows. macos-15's Xcode 16.4 is the oldest the build supports. The runner has CMake and the .NET SDK (for
    # nbgv's version); the shaders need glslang and SPIRV-Cross.
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the shader tools
        run: brew install glslang spirv-cross

      - name: Build
        run: |
          cmake -S src/mac -B src/mac/build
          cmake --build src/mac/build --parallel "$(sysctl -n hw.ncpu)"

      # As on Windows, the game's tests pass with a note without the retail install.
      - name: Test
        run: src/mac/build/mc_tests
