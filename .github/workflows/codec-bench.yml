# Probe, never merged (15 Nov, the menu-stage session): builds tools/codec-bench/unpack_bench.c on Windows with the
# game's own decoders, zstd 1.5.7's decompressor (src/lib/zstd-1.5.7, ZSTD_DISABLE_ASM, as MCCore.vcxproj builds it)
# and libdeflate 1.26's, at the Release configuration's settings (/O2 /Oi /Gy /MT, NDEBUG), for the test laptop's
# unpacking times. The exe is the run's artifact. This branch drops windows.yml, so the game isn't built.
name: Codec bench (probe)

on:
  push:
    branches: ['windows-codec-bench']

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ tools.' }
          $zstd = Get-ChildItem src\lib\zstd-1.5.7\lib\common\*.c, src\lib\zstd-1.5.7\lib\decompress\*.c | ForEach-Object { $_.FullName }
          $deflate = 'src\lib\libdeflate-1.26\lib\deflate_decompress.c', 'src\lib\libdeflate-1.26\lib\utils.c', 'src\lib\libdeflate-1.26\lib\x86\cpu_features.c'
          $sources = @('tools\codec-bench\unpack_bench.c') + $zstd + $deflate
          New-Item -ItemType Directory -Force out | Out-Null
          $vcvars = "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul"
          $common = "/nologo /O2 /Oi /Gy /MT /std:c11 /DNDEBUG /DZSTD_DISABLE_ASM /W1 /Isrc\lib\zstd-1.5.7\lib /Isrc\lib\libdeflate-1.26"
          # The game's build (MCCore.vcxproj's settings); the same with AVX2 (zstd's BMI2 code compiled in); and
          # clang-cl, whose zstd picks its BMI2 code at run time (DYNAMIC_BMI2, which MSVC lacks).
          $builds = [ordered]@{ 'msvc' = "cl $common"; 'msvc-avx2' = "cl $common /arch:AVX2"; 'clangcl' = "clang-cl $common" }
          foreach ($name in $builds.Keys) {
            New-Item -ItemType Directory -Force "out\$name" | Out-Null
            cmd /c "call $vcvars && $($builds[$name]) /Foout\$name\ /Feout\unpack_bench-$name.exe $($sources -join ' ')"
            if ($LASTEXITCODE -ne 0) {
              if ($name -eq 'msvc') { throw "cl failed with exit code $LASTEXITCODE." }
              Write-Warning "The $name build failed with exit code $LASTEXITCODE."
            }
          }
          cmd /c "call $vcvars && cl 2>&1" | Select-Object -First 1 | Set-Content out\compiler.txt
          cmd /c "call $vcvars && clang-cl --version 2>&1" | Select-Object -First 1 | Add-Content out\compiler.txt
          Get-Content out\compiler.txt
          # The version banners come from runs without sources, whose exit codes aren't the builds'.
          exit 0

      - name: Keep the exe
        uses: actions/upload-artifact@v4
        with:
          name: unpack-bench
          path: |
            out/unpack_bench-*.exe
            out/compiler.txt
