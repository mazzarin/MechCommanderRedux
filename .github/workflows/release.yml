# Builds main, runs the tests, and publishes a GitHub Release tagged v<version>.
# Run it by hand from the Actions tab ("Release" -> "Run workflow"). The version is Nerdbank.GitVersioning's
# major.minor.release.build for main's head (see version.json), so the tag always matches the version built
# into the exe. If main hasn't moved since the last release, the tag already exists and the run stops.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    # The Mac app, built and tested as checks.yml's macos job does, zipped for the release job.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the shader tools
        run: brew install glslang spirv-cross

      - name: Build
        run: |
          cmake -S src/mac -B src/mac/build
          cmake --build src/mac/build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: src/mac/build/mc_tests

      # ditto keeps the app bundle's links and signature intact, which zip doesn't.
      - name: Package
        run: |
          mkdir -p dist/MechCommanderRedux
          cp -R "src/mac/build/MechCommander Redux.app" src/docs/INSTALL-Mac.txt dist/MechCommanderRedux/
          ditto -c -k --keepParent dist/MechCommanderRedux dist/MechCommanderRedux-mac-arm64.zip

      - name: Hand the zip to the release job
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/MechCommanderRedux-mac-arm64.zip
          if-no-files-found: error

  release:
    # Only from main: nbgv treats main as a public release (publicReleaseRefSpec in version.json).
    if: github.ref == 'refs/heads/main'
    needs: mac
    # The projects use toolset v145, which needs Visual Studio 2026.
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          # nbgv counts commits, so it needs the full history.
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Get the version
        id: version
        shell: pwsh
        run: |
          dotnet tool restore
          $version = dotnet nbgv get-version -v Version
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "nbgv could not compute the version." }
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists: main has no new commits since that release." }
          # ls-remote exits 2 when the tag is missing; don't let that fail the step.
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "Releasing $tag ($env:GITHUB_SHA)"

      # The shaders' dxc is fetched by the build itself (MCFetchDxc in src/MechCommander.props).
      - name: Build
        run: msbuild src\MCRedux.slnx -p:Configuration=Release -p:Platform=x64 -m

      # The game: tests need the retail install (--game), which the runner doesn't have; they pass with a note.
      - name: Test
        run: src\build\bin\x64\Release\mc_tests.exe

      - name: Package
        shell: pwsh
        run: |
          $bin = "src\build\bin\x64\Release"
          # The zips keep the same names in every release, so README.md can link to the newest one
          # (releases/latest/download/<name>); the version is in the release's title and tag, and in the exes.
          $name = "MechCommanderRedux"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          # The editor links MFC and SQLite statically, so it needs no DLLs beside it.
          Copy-Item "$bin\MCRedux.exe", "$bin\SDL3.dll", "$bin\MCEditor.exe", src\docs\README.txt, src\docs\INSTALL.txt "dist\$name"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name-win-x64.zip"
          Compress-Archive -Path "$bin\MCRedux.pdb", "$bin\SDL3.pdb", "$bin\MCEditor.pdb" -DestinationPath "dist\$name-win-x64-symbols.zip"

      - name: Get the Mac app
        uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist

      # gh creates the tag on the built commit.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag (Get-ChildItem dist\*.zip).FullName `
            --target $env:GITHUB_SHA `
            --title "MechCommander Redux $tag" `
            --generate-notes
